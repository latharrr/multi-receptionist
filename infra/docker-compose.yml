# Local development and tests only. Passwords here are throwaway dev values, not secrets.
# Start with `pnpm db`: it also creates the login roles (infra/postgres-init.sql).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20
    volumes:
      # Named, so the data survives the container being recreated or removed.
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
